<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日幸运签</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: white;
      width: 400px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
    }

    #message {
      font-size: 22px;
      min-height: 70px;
      margin: 30px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🔮 今日幸运签</h1>

    <div id="message">
      点击下面的按钮，抽一张幸运签吧！
    </div>

    <button onclick="drawFortune()">✨ 抽一张</button>
  </div>

  <script>
    const fortunes = [
      "🌟 今天适合尝试一件新事情！",
      "🍀 好运正在向你靠近。",
      "💪 今天的你，比昨天更厉害。",
      "☀️ 保持好心情，好事可能马上发生。",
      "🎯 专注做好一件事，你会有惊喜。",
      "🚀 大胆一点，你可能比自己想象的更优秀。",
      "😊 今天记得多笑一笑。",
      "💡 一个新的想法可能改变很多事情。"
    ];

    function drawFortune() {
      const randomIndex = Math.floor(Math.random() * fortunes.length);
      document.getElementById("message").textContent = fortunes[randomIndex];
    }
  </script>

</body>
</html>
